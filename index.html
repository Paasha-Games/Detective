<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لێکۆڵەر | Lêkoler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Arabic', sans-serif; background: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .hidden { display: none; }
        .chat-bubble { border-radius: 18px; padding: 12px 16px; margin-bottom: 12px; max-width: 85%; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .ai-msg { background: #1e293b; border-right: 4px solid #ef4444; align-self: flex-start; }
        .user-msg { background: #3b82f6; border-left: 4px solid #ffffff; align-self: flex-end; }
        input::placeholder { color: #94a3b8; }
    </style>
</head>
<body>

    <div id="screen-menu" class="flex flex-col items-center justify-center h-screen p-6">
        <div class="bg-red-600/10 p-10 rounded-full mb-6 border border-red-500/30">
            <h1 class="text-7xl font-bold text-red-500">لێکۆڵەر</h1>
        </div>
        <p class="text-xl mb-10 text-slate-400">گەورەترین یاری تاقیکردنەوەی زیرەکی و لێکۆڵینەوە</p>
        <button onclick="showScreen('screen-name')" class="bg-red-600 hover:bg-red-500 text-white px-16 py-4 rounded-xl text-2xl font-bold shadow-lg shadow-red-900/40 transition-all">دەستپێکردن</button>
        <div class="mt-8 text-slate-500 font-bold">پلەی لێکۆڵەر: ⭐ <span id="credit-count">0</span></div>
    </div>

    <div id="screen-name" class="hidden flex flex-col items-center justify-center h-screen p-6">
        <h2 class="text-3xl mb-8">ناوی لێکۆڵەر بنووسە:</h2>
        <input type="text" id="player-name" class="bg-slate-800 border-2 border-slate-700 rounded-2xl p-4 text-center text-2xl w-full max-w-sm focus:border-red-500 outline-none transition-all" placeholder="وەک: ئاراس">
        <button onclick="startGame()" class="mt-8 bg-slate-100 text-slate-900 px-10 py-3 rounded-xl text-xl font-bold">دواتر</button>
    </div>

    <div id="screen-story" class="hidden flex flex-col items-center justify-center min-h-screen p-6">
        <div class="max-w-xl w-full bg-slate-800/50 p-8 rounded-3xl border border-slate-700 backdrop-blur-sm">
            <div class="flex items-center gap-3 mb-4 text-red-400">
                <span class="text-2xl">🔍</span>
                <h3 class="text-2xl font-bold text-right">ڕاپۆرتی تاوان:</h3>
            </div>
            <p id="story-text" class="text-xl leading-relaxed text-slate-200 mb-10 text-right">خەریکە ڕاپۆرتەکە ئامادە دەکرێت...</p>
            <button onclick="showScreen('screen-chat')" class="w-full bg-green-600 hover:bg-green-500 py-4 rounded-2xl font-bold text-xl transition-all">چوونە ناو گرووپی گومانلێکراوان</button>
        </div>
    </div>

    <div id="screen-chat" class="hidden flex flex-col h-screen max-w-2xl mx-auto border-x border-slate-800 bg-slate-900/50">
        <header class="p-4 bg-slate-800 flex justify-between items-center shadow-xl">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                <span class="font-bold text-slate-300">گرووپی لێکۆڵینەوە</span>
            </div>
            <button onclick="showVoting()" class="bg-yellow-500 text-slate-900 px-4 py-2 rounded-lg font-bold text-sm">کێ تاوانبارە؟ ⚖️</button>
        </header>
        
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 flex flex-col">
            </div>

        <div class="p-4 bg-slate-800 flex gap-2">
            <input type="text" id="user-input" placeholder="پرسیار لە گومانلێکراوان بکە..." class="flex-1 bg-slate-900 p-4 rounded-xl border border-slate-700 focus:outline-none focus:border-blue-500">
            <button onclick="sendMessage()" class="bg-blue-600 px-6 py-2 rounded-xl text-2xl">🕊️</button>
        </div>
    </div>

    <div id="screen-result" class="hidden flex flex-col items-center justify-center h-screen p-6 text-center">
        <div id="result-icon" class="text-8xl mb-6"></div>
        <h2 id="result-title" class="text-5xl font-bold mb-4"></h2>
        <p id="result-desc" class="text-xl text-slate-400 mb-10 max-w-md"></p>
        <button onclick="location.reload()" class="bg-red-600 px-12 py-4 rounded-2xl font-bold text-xl shadow-xl">یاری نوێ 🔄</button>
    </div>

    <script>
    // 1. Double-check your key parts. 
    // Make sure there are NO spaces inside the quotes.
    const part1 = "AIzaSyB"; 
    const part2 = "DPKQYcF-r3riU3y0pwHcpResQrRHf7aQ"; 
    const API_KEY = (part1 + part2).trim();

    let credits = parseInt(localStorage.getItem('det_credits')) || 0;
    let playerName = "";
    let gameStory = "";

    document.getElementById('credit-count').innerText = credits;

    function showScreen(id) {
        document.querySelectorAll('div[id^="screen-"]').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    async function talkToGemini(prompt) {
        try {
            // FIXED URL: Removed 'v1beta' and used 'v1' for maximum stability
            // Also ensured the model name is exactly 'gemini-1.5-flash'
            const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                console.log("Full Error Object:", errorData); // This helps us debug
                return "هەڵە: وادیارە کێشەیەک لە سێرڤەر هەیە. تکایە دووبارە تاقیکەرەوە.";
            }

            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        } catch (e) {
            console.error("Network Error:", e);
            return "پەیوەندی ئینتەرنێتەکەت تاقیکەرەوە یان دڵنیابە لە کلیلی API.";
        }
    }

    async function startGame() {
        playerName = document.getElementById('player-name').value || "لێکۆڵەر";
        document.getElementById('story-text').innerText = "خەریکە لێکۆڵەرەکان ڕاپۆرتەکە دەنووسن... چاوەڕێبە...";
        showScreen('screen-story');
        
        const prompt = `Write a crime story in Sorani Kurdish. 
        Set it in a Kurdish city. Include 3 suspects with Kurdish names. 
        Describe the mystery but don't say who did it. Keep it short.`;
        
        const result = await talkToGemini(prompt);
        gameStory = result;
        document.getElementById('story-text').innerText = result;
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const val = input.value;
        if(!val) return;

        appendMsg(playerName, val, 'user-msg');
        input.value = "";

        const prompt = `Story: ${gameStory}. The detective says: "${val}". 
        Respond as the 3 suspects in a group chat in Sorani Kurdish. 
        Be funny and use emojis for their faces.`;

        const reply = await talkToGemini(prompt);
        appendMsg("گومانلێکراوان", reply, 'ai-msg');
    }

    function appendMsg(sender, text, type) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `chat-bubble ${type}`;
        div.innerHTML = `<span class="text-xs font-bold opacity-50">${sender}</span><br>${text.replace(/\n/g, '<br>')}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    async function showVoting() {
        const prompt = `Reveal the killer and the reason from the story in Sorani Kurdish.`;
        const finalTruth = await talkToGemini(prompt);
        
        showScreen('screen-result');
        document.getElementById('result-title').innerText = "کێ تاوانبار بوو؟";
        document.getElementById('result-desc').innerText = finalTruth;
        document.getElementById('result-icon').innerText = "🔎";
        
        credits++;
        localStorage.setItem('det_credits', credits);
        document.getElementById('credit-count').innerText = credits;
    }
</script>
</body>
</html>
