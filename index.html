<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>لێکۆڵەر | Lêkoler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Arabic', sans-serif; background: #0f172a; color: #f8fafc; touch-action: manipulation; }
        .hidden { display: none; }
        .chat-bubble { border-radius: 18px; padding: 12px 16px; margin-bottom: 12px; max-width: 85%; }
        .ai-msg { background: #1e293b; border-right: 4px solid #ef4444; align-self: flex-start; }
        .user-msg { background: #3b82f6; border-left: 4px solid #ffffff; align-self: flex-end; }
        /* Fixes the chat scroll and prevents UI jump */
        #chat-container { height: 60vh; overflow-y: auto; display: flex; flex-direction: column; }
        .suspect-btn { background: #334155; transition: 0.3s; border: 1px solid #475569; }
        .suspect-btn:hover { background: #ef4444; border-color: white; }
    </style>
</head>
<body>

    <div id="screen-menu" class="flex flex-col items-center justify-center h-screen p-6">
        <h1 class="text-7xl font-bold text-red-500 mb-4">لێکۆڵەر</h1>
        <p class="text-xl mb-10 text-slate-400">گەورەترین یاری لێکۆڵینەوە</p>
        <button onclick="showScreen('screen-name')" class="bg-red-600 px-16 py-4 rounded-xl text-2xl font-bold shadow-lg">دەستپێکردن</button>
        <div class="mt-8 text-slate-500 font-bold">⭐ پلەی لێکۆڵەر: <span id="credit-count">0</span></div>
    </div>

    <div id="screen-name" class="hidden flex flex-col items-center justify-center h-screen p-6">
        <h2 class="text-3xl mb-8">ناوی لێکۆڵەر بنووسە:</h2>
        <input type="text" id="player-name" class="bg-slate-800 border-2 border-slate-700 rounded-2xl p-4 text-center text-2xl w-full max-w-sm outline-none" placeholder="وەک: ئاراس">
        <button onclick="startGame()" class="mt-8 bg-slate-100 text-slate-900 px-10 py-3 rounded-xl text-xl font-bold">دواتر</button>
    </div>

    <div id="screen-story" class="hidden flex flex-col items-center justify-center min-h-screen p-6">
        <div class="max-w-xl w-full bg-slate-800/50 p-8 rounded-3xl border border-slate-700">
            <h3 class="text-2xl font-bold mb-4 text-red-400 text-right">ڕاپۆرتی تاوان:</h3>
            <p id="story-text" class="text-xl leading-relaxed text-slate-200 mb-10 text-right">چاوەڕێی کەیسەکە بکە...</p>
            <button id="btn-to-chat" disabled onclick="showScreen('screen-chat')" class="w-full bg-slate-600 py-4 rounded-2xl font-bold text-xl opacity-50 cursor-not-allowed transition-all">چوونە ناو گرووپی گومانلێکراوان</button>
        </div>
    </div>

    <div id="screen-chat" class="hidden flex flex-col h-screen max-w-2xl mx-auto bg-slate-900">
        <header class="p-4 bg-slate-800 flex justify-between items-center shadow-md z-10">
            <span class="font-bold text-slate-300">گرووپی لێکۆڵینەوە</span>
            <button id="vote-trigger" class="hidden bg-yellow-500 text-slate-900 px-4 py-2 rounded-lg font-bold" onclick="showVotingOptions()">کێ تاوانبارە؟ ⚖️</button>
        </header>
        
        <div id="chat-container" class="flex-1 p-4">
            <div id="chat-box" class="flex flex-col"></div>
        </div>

        <div id="voting-zone" class="hidden p-4 bg-slate-800 border-t border-red-500/30">
            <p class="text-center mb-4 text-yellow-400 font-bold">یەکێک هەڵبژێرە:</p>
            <div id="suspect-list" class="flex flex-col gap-2"></div>
        </div>

        <div id="chat-input-area" class="p-4 bg-slate-800 flex gap-2">
            <input type="text" id="user-input" placeholder="پرسیار بکە..." class="flex-1 bg-slate-900 p-4 rounded-xl border border-slate-700 outline-none">
            <button onclick="sendMessage()" class="bg-blue-600 px-6 py-2 rounded-xl text-2xl">🕊️</button>
        </div>
    </div>

    <div id="screen-result" class="hidden flex flex-col items-center justify-center h-screen p-6 text-center">
        <div id="result-icon" class="text-8xl mb-6"></div>
        <h2 id="result-title" class="text-5xl font-bold mb-4"></h2>
        <p id="result-desc" class="text-xl text-slate-400 mb-10"></p>
        <button onclick="location.reload()" class="bg-red-600 px-12 py-4 rounded-2xl font-bold text-xl">یاری نوێ 🔄</button>
    </div>

    <script>
        const p1 = "AIzaSyC8QLiH-PdBoXpT"; 
        const p2 = "XzCpIIoMsowqkUGNUUE"; 
        const key = (p1 + p2).trim();

        let credits = parseInt(localStorage.getItem('det_credits')) || 0;
        let playerName = "";
        let gameStory = "";
        let suspects = [];
        let killerName = "";
        let messageCount = 0;

        document.getElementById('credit-count').innerText = credits;

        function showScreen(id) {
            document.querySelectorAll('div[id^="screen-"]').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        async function talkToGemini(promptText) {
            const url = `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${key}`;
            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            } catch (e) { return "هەڵە لە پەیوەندی."; }
        }

        async function startGame() {
            playerName = document.getElementById('player-name').value || "لێکۆڵەر";
            showScreen('screen-story');
            
            const prompt = `Write a short crime story in Sorani Kurdish. Detective's name is ${playerName}.
            Pick 3 RANDOM Kurdish names for suspects (DON'T always use Dana, Shano, Bakir).
            List the 3 names clearly at the end like: [NAMES: Name1, Name2, Name3] and tell me the killer like [KILLER: Name].
            The story should be a mystery in a Kurdish city.`;
            
            const result = await talkToGemini(prompt);
            gameStory = result;
            
            // Extract suspects and killer from AI response
            const nameMatch = result.match(/\[NAMES: (.*?)\]/);
            const killerMatch = result.match(/\[KILLER: (.*?)\]/);
            
            if(nameMatch) suspects = nameMatch[1].split(',').map(n => n.trim());
            if(killerMatch) killerName = killerMatch[1].trim();

            document.getElementById('story-text').innerText = result.split('[')[0];
            
            const startBtn = document.getElementById('btn-to-chat');
            startBtn.disabled = false;
            startBtn.classList.replace('bg-slate-600', 'bg-green-600');
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const val = input.value;
            if(!val) return;

            appendMsg(playerName, val, 'user-msg');
            input.value = "";
            messageCount++;

            if(messageCount >= 3) document.getElementById('vote-trigger').classList.remove('hidden');

            const prompt = `You are a group chat of these suspects: ${suspects.join(', ')}. 
            The detective ${playerName} asked: "${val}". Respond as the characters in Sorani Kurdish. Use emojis.`;
            const reply = await talkToGemini(prompt);
            appendMsg("گومانلێکراوان", reply, 'ai-msg');
        }

        function appendMsg(sender, text, type) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `chat-bubble ${type}`;
            div.innerHTML = `<strong>${sender}</strong><br>${text}`;
            box.appendChild(div);
            document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;
        }

        function showVotingOptions() {
            document.getElementById('chat-input-area').classList.add('hidden');
            const zone = document.getElementById('voting-zone');
            zone.classList.remove('hidden');
            
            const list = document.getElementById('suspect-list');
            list.innerHTML = "";
            suspects.forEach(name => {
                const btn = document.createElement('button');
                btn.className = "suspect-btn p-4 rounded-xl font-bold text-lg";
                btn.innerText = name;
                btn.onclick = () => finishGame(name);
                list.appendChild(btn);
            });
        }

        async function finishGame(choice) {
            const isWin = (choice.toLowerCase() === killerName.toLowerCase());
            const prompt = `The player chose ${choice} as the killer. The real killer was ${killerName}. 
            Explain the ending in Sorani Kurdish.`;
            const truth = await talkToGemini(prompt);

            showScreen('screen-result');
            if(isWin) {
                credits++;
                localStorage.setItem('det_credits', credits);
                document.getElementById('result-title').innerText = "دەستخۆش! بردیانەوە 🏆";
                document.getElementById('result-icon').innerText = "✅";
                document.getElementById('credit-count').innerText = credits;
            } else {
                document.getElementById('result-title').innerText = "دۆڕایت! ❌";
                document.getElementById('result-icon').innerText = "💀";
            }
            document.getElementById('result-desc').innerText = truth;
        }
    </script>
</body>
</html>
